<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>围桌 · 画面预览</title>
  <link rel="stylesheet" href="./preview.css?v=20261126-preview9">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="http://127.0.0.1:5189/主体原型/?endpoint=overview"><b>围</b><span>围桌 <small>画面预览</small></span></a>
    <nav aria-label="项目入口"><a href="http://127.0.0.1:5189/主体原型/?endpoint=overview">游戏主体 ↗</a><span aria-current="page">画面预览</span></nav>
  </header>
  <div class="workspace">
    <aside class="flow-sidebar" aria-label="游戏流程">
      <div class="sidebar-heading"><h1>按流程看画面</h1><button id="resume" type="button">回到上次</button></div>
      <nav id="flowNav" aria-label="流程节点"></nav>
      <details class="feature-map"><summary>功能对应</summary><table><caption>本轮功能盘点</caption><thead><tr><th>原有功能</th><th>当前位置</th></tr></thead><tbody><tr><td>电脑 / 手机预览</td><td>顶部视角与尺寸</td></tr><tr><td>顶光唤醒</td><td>开场与入场</td></tr><tr><td>过渡三方案</td><td>顶光 → 选本过渡</td></tr><tr><td>时空入场</td><td>开场与入场 · 备选</td></tr><tr><td>纵深通道与翻书</td><td>选本与建房</td></tr><tr><td>六个旧选本交互</td><td>选本走廊 · 其他方案</td></tr><tr><td>旧详情排版对比</td><td>剧本详情 · 其他方案</td></tr><tr><td>方案选择</td><td>每个画面下方</td></tr><tr><td>五视角、画布与实验室</td><td>游戏主体</td></tr></tbody></table></details>
    </aside>
    <main>
      <section class="scene-heading"><div><p id="breadcrumb"></p><h2 id="sceneTitle"></h2></div><span id="sceneStatus" class="status"></span></section>
      <div class="view-toolbar">
        <label>视角<select id="perspective"><option value="owner">房主玩家</option><option value="invited">受邀玩家</option><option value="computer">电脑主机端</option><option value="host">主持端</option></select></label>
        <label>画面尺寸<select id="device"><option value="portrait">手机竖屏</option><option value="landscape">手机横屏</option><option value="desktop">电脑宽屏</option></select></label>
        <div class="mode-switch" role="group" aria-label="展示方式"><button id="single" aria-pressed="true">单方案</button><button id="compare" aria-pressed="false">并排对比</button></div>
      </div>
      <div id="plans" class="plans" role="group" aria-label="当前流程方案"></div>
      <section id="screens" class="screens" aria-label="画面展示"></section>
      <section class="playback" aria-label="播放控制">
        <div class="playback-buttons"><button id="replay">重播</button><button id="play">播放</button><button id="pause">暂停</button><button id="next">下一步 →</button><label class="check"><input id="continuous" type="checkbox">连播到下一步</label></div>
        <div id="timeline" class="timeline"><label for="seek">动画进度</label><input id="seek" type="range" min="0" max="8.8" step="0.05" value="0"><output id="timeReadout" for="seek">0.0 秒</output></div>
        <p id="playbackNote" class="muted"></p>
      </section>
      <p id="notice" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script type="module" src="./preview.js?v=20261126-preview9"></script>
</body>
</html>
